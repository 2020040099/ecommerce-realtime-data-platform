name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint & test
        run: make check
